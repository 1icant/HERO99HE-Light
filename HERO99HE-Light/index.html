<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HERO 99HE · Light Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23c5afff'/%3E%3Cpath d='M15 12v24m18-24v24M15 24h18' stroke='%231b1428' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=0.1.26">
  <script defer src="layout.js?v=0.1.26"></script>
  <script defer src="core.js?v=0.1.26"></script>
  <script defer src="app.js?v=0.1.26"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="logo">H</span><span>HERO <b>99HE</b><small>LIGHT STUDIO <span>v0.1.26</span></small></span></a>
    <div class="connection"><span id="status" class="status"><i></i>预览模式</span><button id="connect" class="primary">连接键盘 ↗</button><button id="disconnect" hidden>断开</button></div>
  </header>
  <main>
    <section class="intro"><div><p class="eyebrow">HERO LIGHT STUDIO</p><h1>灯光工作台</h1></div><div class="file-actions"><button id="import" class="quiet">导入</button><button id="export" class="quiet">导出</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></section>
    <div class="workspace">
      <div class="creative">
        <section class="card canvas-panel">
          <div class="panel-head"><div class="tabs" role="tablist" aria-label="编辑模式"><button class="tab active" id="tabLive" role="tab" aria-selected="true">灯光预览</button><button class="tab" id="tabStudio" role="tab" aria-selected="false">动画工作台</button></div><span id="previewMode" class="preview-label">实时预览</span></div>
          <div class="keyboard-wrap"><div id="stripPreview" class="strip-preview" role="img" aria-label="灯带颜色预览"></div><div id="keyboard" class="keyboard" aria-label="HERO 99HE 逐键预览"></div></div>
          <div class="paint-toolbar"><label class="toggle"><input id="paintMode" type="checkbox"><span class="switch"></span>逐键画笔</label><span id="hoverKey" class="muted small">点击键帽体验灯效</span><button id="clearPaint" class="quiet">清除涂色</button></div>
          <section id="studioPanel" class="library" hidden><div class="section-head"><h2>灯光时间线</h2><span id="frameCount">0 / 120</span></div><div class="studio-tools"><button id="capture" class="accent">＋ 捕获一帧</button><button id="playStudio">播放</button><button id="duplicateFrame" disabled>复制</button><button id="moveFrameLeft" disabled aria-label="帧向前移动">←</button><button id="moveFrameRight" disabled aria-label="帧向后移动">→</button><button id="deleteFrame" class="quiet" disabled>删除</button><label class="duration">帧时长 <input id="frameMs" type="number" min="25" max="5000" step="25" value="100"> ms</label></div><div id="timeline" class="timeline"></div><div class="timeline-seek"><input id="timelineSeek" type="range" min="0" max="0" step="1" value="0" disabled aria-label="定位动画帧"><span id="timelinePosition" class="small muted">还没有帧</span></div></section>
        </section>
        <section id="livePanel" class="card library"><div class="section-head"><h2>灯效模式 <span id="effectCount" class="pill"></span></h2><select id="effectFilter" class="effect-filter" aria-label="筛选灯效"><option value="all">全部灯效</option><option value="flow">流动光效</option><option value="ambient">氛围灯效</option><option value="reactive">按键互动</option></select></div><div id="effects" class="effect-grid"></div></section>
        <section class="card library"><div class="section-head"><h2>我的配色 <span class="pill" id="savedPaletteCount">0</span></h2></div>
          <form id="paletteSaveForm" class="saved-palette-row"><input id="paletteName" type="text" maxlength="40" required aria-label="新配色名称" placeholder="给当前配色起个名字…"><button type="submit" class="accent">保存当前配色</button></form>
          <div class="saved-palette-row"><select id="savedPalettes" aria-label="已保存的配色" disabled></select><button type="button" id="applySavedPalette" disabled>套用</button><button type="button" id="deleteSavedPalette" class="quiet" disabled>删除</button></div>
        </section>
        <section class="card library"><div class="section-head"><h2>配色灵感 <span class="pill">30</span></h2><input id="presetSearch" type="search" placeholder="搜索配色…" aria-label="搜索配色"></div><div id="presets" class="preset-grid"></div></section>
      </div>
      <aside class="settings">
        <section class="card control-card">
          <div class="section-head"><h2>键盘灯光</h2><span class="section-dot"></span></div>
          <div class="control-group"><label for="color">主色 <span id="colorHex">#61DAFB</span></label><div class="color-line"><input id="color" type="color" value="#61dafb" aria-label="主色"><div id="swatches" class="swatches"></div></div><div id="palettePreview" class="palette-preview" aria-label="当前配色"></div><div id="paletteEditor" class="palette-editor" aria-label="逐色编辑配色"></div></div>
          <div class="control-group"><label for="brightness">亮度 <output id="brightnessValue">60%</output></label><input id="brightness" type="range" min="0" max="100" value="60"></div>
          <div class="control-group"><label for="speed">速度 <output id="speedValue">1.0×</output></label><input id="speed" type="range" min="10" max="400" value="100"></div>
          <div class="control-group inline-control"><label for="bg">底色</label><input id="bg" type="color" value="#050812" aria-label="背景底色"></div>
          <div class="action-row"><button id="start" class="primary" disabled>开始输出</button><button id="stop" disabled>停止</button></div>
        </section>
        <section class="card control-card strip-card">
          <div class="section-head"><h2>PgDn 下方 · 单灯珠 Logo</h2><span id="logoPreview" class="logo-preview" aria-label="Logo灯颜色预览"></span></div>
          <div class="control-group"><label for="logoMode">Logo 模式</label><select id="logoMode"><option value="off">不接管 · 保留当前灯效</option><option value="solid">独立纯色</option><option value="follow-color">主色直连 · 手动改色才变化</option><option value="auto-color">自动取色 · 跟随键盘主导色</option><option value="keyflash">击键闪亮（160ms）</option></select></div>
          <div class="strip-controls"><div><label for="logoColor">Logo 颜色</label><input id="logoColor" type="color" value="#00a0ff"></div><div><label for="logoBrightness">独立亮度</label><select id="logoBrightness"><option value="0">关闭（原生 0）</option><option value="1">亮度 1（原生 1）</option><option value="2" selected>亮度 2（原生 2）</option><option value="3">亮度 3（原生 3）</option><option value="4">亮度 4（原生 4）</option></select></div></div>
          <button id="applyLogo" class="accent wide" disabled>应用 Logo</button><p id="logoStatus" class="small muted" role="status">Logo 设置尚未应用。</p>
        </section>
        <section class="card control-card strip-card">
          <div class="section-head"><h2>顶部灯带</h2><span class="strip-badge">独立控制</span></div>
          <div class="control-group"><label for="stripMode">灯带模式</label><select id="stripMode"><option value="off">关闭</option><option value="solid">纯色常亮</option><option value="breathe">柔和呼吸</option><option value="auto-color">自动取色 · 应用时取一次</option><optgroup label="原厂固件灯效"><option value="native-neon">彩色霓虹</option><option value="native-marquee">彩色跑马</option></optgroup></select></div>
          <div class="strip-controls"><div><label for="sideColor">灯带颜色</label><input id="sideColor" type="color" value="#00a0ff"></div><div><label for="sideBrightness">亮度 · 1–5 档</label><select id="sideBrightness"><option value="1">亮度 1</option><option value="2">亮度 2</option><option value="3" selected>亮度 3</option><option value="4">亮度 4</option><option value="5">亮度 5</option></select></div></div>
          <div class="control-group"><label for="sideGain">鲜亮增强 <output id="sideGainValue">100%</output></label><input id="sideGain" type="range" min="100" max="200" step="5" value="100"></div>
          <button id="applySideLight" class="accent wide" disabled>应用灯带</button>
          <p id="sideResult" class="small muted" role="status">灯带设置尚未应用。</p>
        </section>
        <details class="card more-settings"><summary>更多设置</summary>
          <div class="control-group"><label for="fps">按键帧率上限 <output id="fpsValue">20 FPS</output></label><input id="fps" type="range" min="5" max="40" value="20"></div>
          <div id="desktopKeyControls" hidden><label class="toggle"><input id="backgroundKeys" type="checkbox"><span class="switch"></span>后台按键响应</label><label for="inputBackend" class="small muted">输入接口</label><select id="inputBackend"><option value="raw">Raw Input · HERO 键盘</option><option value="poll">兼容模式 · 所有键盘</option></select><p id="inputStatus" class="small muted" role="status">默认关闭，不记录输入明细。</p></div>
        </details>
      </aside>
    </div>
    <footer><span>HERO LIGHT STUDIO · 独立灯光工具</span><span>本地保存 · 无云端上传</span></footer>
    <span id="lastLog" class="sr-only" role="status"></span>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
